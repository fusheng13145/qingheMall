# ============================================================
# 青禾商城 一键启动编排（M3-9 容器化）
# 用法：docker compose up -d --build
# 访问：前端 http://localhost:80（Nginx 托管 + 反代 /api）；启用 HTTPS 见下
#       后端 http://localhost:8080/api（仅本机 127.0.0.1 暴露）
# 默认账号：admin / 123456
#
# P1-4 安全加固（2026-08-11）：
#   ① Redis 启用 requirepass 认证（原裸奔）；
#   ② 中间件端口收敛：MySQL/Redis 不再映射宿主，仅内网可达；
#      后端/Prometheus/Grafana 仅绑定 127.0.0.1；对外仅 80/443；
#   ③ 全服务补 restart: unless-stopped；
#   ④ 前端支持可选 HTTPS（SSL_ENABLED=true + 挂载 deploy/ssl 证书）。
# ============================================================
services:
  mysql:
    image: mysql:8.0
    container_name: qinghe-mysql
    environment:
      # ⚠️ 生产务必通过 .env 覆盖为强口令；此处仅为本地开发默认（非 root123 弱口令）
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-QhMallDev2026!}
      MYSQL_DATABASE: qinghedb
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    # P1-4：不再向宿主暴露 3306，仅 compose 内网可达；如需本机直连可临时解开注释
    # ports:
    #   - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动自动执行初始化脚本（建库建表 + 种子数据 + admin 账号）
      - ./backend/index.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-QhMallDev2026!}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: qinghe-redis
    # P1-4：启用 requirepass 认证（原无密码裸奔）；口令与 backend REDIS_PASSWORD 同源
    command: redis-server --requirepass ${REDIS_PASSWORD:-QhMallDev2026!}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-QhMallDev2026!}
    # P1-4：不再向宿主暴露 6379，仅 compose 内网可达
    # ports:
    #   - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: qinghe-backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/qinghedb?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8
      DB_USERNAME: ${DB_USERNAME:-root}
      # ⚠️ 生产务必通过 .env 覆盖 DB_PASSWORD 为强口令（勿使用代码库中的开发默认值）
      DB_PASSWORD: ${DB_PASSWORD:-QhMallDev2026!}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # P1-4：与 redis requirepass 同源，保证认证一致
      REDIS_PASSWORD: ${REDIS_PASSWORD:-QhMallDev2026!}
      # 阶段二 B-②：Elasticsearch 搜索（容器名 elasticsearch，仅 compose 内网可达）
      ELASTICSEARCH_HOSTS: ${ELASTICSEARCH_HOSTS:-http://elasticsearch:9200}
      UPLOAD_DIR: /app/upload
      # 会话 Cookie Secure 标记：默认 HTTP 部署需 false 才能下发 Cookie；启用 HTTPS 时置 true
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    # P1-4：仅绑定 127.0.0.1，避免 8080 直接对外（对外流量一律走前端 nginx 反代）
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - upload-data:/app/upload
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: qinghe-frontend
    ports:
      - "80:80"
      # P1-3：启用 HTTPS 需 443（配合 SSL_ENABLED=true 与下方证书挂载）
      - "443:443"
    environment:
      # P1-3：true 时切换 HTTPS（需挂载证书，缺证书将 fail-closed 拒绝启动）
      SSL_ENABLED: ${SSL_ENABLED:-false}
    volumes:
      # P1-3：证书目录（fullchain.pem + privkey.pem），仅 SSL_ENABLED=true 时需要
      - ./deploy/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    restart: unless-stopped

  # ============ 监控（P2-2，可选启动）============
  # 指标端点：http://localhost:8080/actuator/prometheus
  # Prometheus：http://localhost:9090 | Grafana：http://localhost:3000（均仅 127.0.0.1）
  # ⚠️ Grafana 口令必须通过 .env 的 GRAFANA_ADMIN_PASSWORD 注入（P1-19，禁止默认 admin/admin）
  prometheus:
    # P1-19：v2.49.1 → v2.53.3（旧版已过维护期）
    image: prom/prometheus:v2.53.3
    container_name: qinghe-prometheus
    # P1-4：仅绑定 127.0.0.1
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - backend
    restart: unless-stopped

  alertmanager:
    # P1-9：告警出口（原缺失）。接收 Prometheus 告警并路由到通知渠道（webhook/邮件等）
    image: prom/alertmanager:v0.27.0
    container_name: qinghe-alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./deploy/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    restart: unless-stopped

  grafana:
    # P1-19：10.2.3 → 11.3.0（旧版含已披露 CVE）
    image: grafana/grafana:11.3.0
    container_name: qinghe-grafana
    # P1-4：仅绑定 127.0.0.1
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      # P1-19：口令必须显式注入，缺省直接启动失败，禁止弱口令
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?请在 .env 设置 GRAFANA_ADMIN_PASSWORD 强口令}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=
    volumes:
      - grafana-data:/var/lib/grafana
      # 自动注册 Prometheus 数据源 + 青禾商城看板（含告警可视化）
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: unless-stopped

  # ============ 搜索与日志聚合基础设施（路线图 B-② / C，按需启用）============
  # Elasticsearch：全文检索基础设施（B-②）。后端索引构建 / 增量同步 / 搜索 API 切换
  #   + 前端搜索对接为「阶段二」，需本服务运行后实跑验证（Docker daemon 未运行时不启动）。
  # ⚠️ 镜像来自 docker.elastic.co，国内拉取可能受限；单节点仅用于本地/小规模，
  #   生产需多节点 + TLS + 安全加固（xpack.security.enabled=true）。
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: qinghe-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - TZ=Asia/Shanghai
    # P1-4：仅绑定 127.0.0.1，避免 9200 直接对外
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Loki：日志聚合接收端（C 日志聚合）。后端结构化日志推送 / Promtail 采集为「阶段二」，
  #   需本服务运行；Grafana 已配置普罗米数据源，接入 Loki 数据源即可在看板关联日志。
  loki:
    image: grafana/loki:3.1.0
    container_name: qinghe-loki
    command: -config.file=/etc/loki/local-config.yaml
    # P1-4：仅绑定 127.0.0.1
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - loki-data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3100/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  mysql-data:
  upload-data:
  prometheus-data:
  grafana-data:
  es-data:
  loki-data:
