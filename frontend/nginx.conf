# ============================================================
# 青禾商城 前端 nginx —— HTTP 站点（默认）
# HTTPS/443 支持见 nginx-ssl.conf（经 docker-entrypoint 按 SSL_ENABLED 切换）
# ============================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # P0-2 修复（2026-08-11）：显式放开请求体上限。nginx 默认 client_max_body_size 1MB，
    # 而后端允许单文件 5MB / 单请求 10MB（application.properties multipart 配置），
    # 不显式声明会导致经 nginx 上传 >1MB 图片直接 413。此处对齐后端 max-request-size=10MB。
    client_max_body_size 10m;

    # 报告项：补 gzip 压缩（原缺失）
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # P2：安全响应头（点击劫持/MIME 嗅探/信息泄露纵深防御）
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: http:; connect-src 'self'; font-src 'self'; object-src 'none'; frame-ancestors 'none'" always;

    # 报告项：补静态资源缓存（原缺失）。Vite 产物带内容哈希，可长缓存。
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 反向代理
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 上传图片静态资源
    location /uploads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }
}
