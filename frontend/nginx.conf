server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # P2：安全响应头（点击劫持/MIME 嗅探/信息泄露纵深防御）
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: http:; connect-src 'self'; font-src 'self'; object-src 'none'; frame-ancestors 'none'" always;

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 反向代理
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 上传图片静态资源
    location /uploads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }
}
