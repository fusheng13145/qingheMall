# ============================================================
# 青禾商城 前端 nginx —— HTTPS 站点（P1-3，可选启用）
# 启用方式：compose 设 SSL_ENABLED=true 并挂载证书到 /etc/nginx/ssl/
#   （fullchain.pem + privkey.pem）。docker-entrypoint 将自动切换本配置。
# 证书可用 Let's Encrypt/certbot 签发后放入 deploy/ssl/ 目录。
# ============================================================

# HTTP → HTTPS 全量跳转
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# HTTPS 主站
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # TLS 证书（挂载至 /etc/nginx/ssl/）
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    root /usr/share/nginx/html;
    index index.html;

    # 对齐后端上传上限（单请求 5MB，application.properties spring.servlet.multipart.max-file-size=5MB），避免 413
    client_max_body_size 5m;

    # gzip 压缩
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # 安全响应头 + HSTS（P1-3：HTTPS 强制，预加载可选）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: http:; connect-src 'self'; font-src 'self'; object-src 'none'; frame-ancestors 'none'" always;

    # 静态资源长缓存（Vite 产物带内容哈希）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 反向代理
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 上传图片静态资源
    location /uploads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }
}
