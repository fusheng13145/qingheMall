# ============================================================
# Grafana 数据源自动配置（RR-8 监控告警）
# 由 docker-compose 挂载到 /etc/grafana/provisioning
# Grafana 启动后自动注册 Prometheus 为默认数据源
# ============================================================
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      httpMethod: POST
      timeInterval: 15s
