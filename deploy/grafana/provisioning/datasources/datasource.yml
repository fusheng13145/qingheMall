# ============================================================
# Grafana 数据源自动配置（RR-8 监控告警）
# 由 docker-compose 挂载到 /etc/grafana/provisioning
# Grafana 启动后自动注册 Prometheus 为默认数据源
# ============================================================
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      httpMethod: POST
      timeInterval: 15s

  # 阶段二 C 日志聚合：Loki 数据源（后端 loki4j appender 直推，#22）
  # uid 固定：C2 的 Grafana 统一告警（Loki ERROR 速率规则）按 uid 引用数据源
  - name: Loki
    type: loki
    uid: loki-qinghe
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: true
    jsonData:
      maxLines: 1000
