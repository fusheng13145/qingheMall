# ============================================================
# 青禾商城 Prometheus 告警规则（RR-8 监控告警）
# 由 deploy/prometheus.yml 的 rule_files 挂载加载
# 指标来源：Spring Boot Actuator + Micrometer（/actuator/prometheus）
# 说明：规则在 Prometheus 内持续求值并进入 firing 状态，
#       经 prometheus.yml 的 alerting 段推送至 Alertmanager（P1-9 告警出口）；
#       通知渠道（webhook/邮件）在 deploy/alertmanager.yml 中配置。
# ============================================================
groups:
  - name: qinghe-mall-backend
    rules:
      # 后端实例不可用：连续 1 分钟抓取失败
      - alert: BackendDown
        expr: up{job="qinghe-mall-backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "青禾商城后端服务不可用"
          description: "Prometheus 无法抓取 backend:8080/actuator/prometheus 已超过 1 分钟，请检查后端容器/端口/健康状态。"

      # HTTP 5xx 错误率过高：近 5 分钟 > 5%
      - alert: HighHttpErrorRate
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            / sum(rate(http_server_requests_seconds_count[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "HTTP 5xx 错误率过高"
          description: "近 5 分钟 5xx 错误率 {{ $value | humanizePercentage }} 超过 5% 阈值，请排查后端异常日志（含 traceId）。"

      # HTTP P95 延迟过高：近 5 分钟 > 1 秒
      - alert: HighHttpLatency
        expr: |
          histogram_quantile(0.95,
            sum(rate(http_server_requests_seconds_bucket[5m])) by (le)
          ) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "HTTP P95 延迟过高"
          description: "近 5 分钟接口 P95 延迟 {{ $value | humanizeDuration }} 超过 1 秒，可能存在慢查询或资源瓶颈。"

      # JVM 堆内存使用率过高：> 85%（按 old gen 估算，兜底用整体 heap）
      - alert: JvmHeapUsageHigh
        expr: |
          jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"} > 0.85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "JVM 堆内存使用率过高"
          description: "堆内存使用率 {{ $value | humanizePercentage }} 超过 85%，持续 10 分钟，关注是否存在内存泄漏或需要扩容。"

      # ============================================================
      # C2 告警细化（v1.4）：业务/中间件维度告警，指标均为后端 Micrometer
      # 经 /actuator/prometheus 暴露的自定义指标（见手册 §9.3-C2）
      # ============================================================

      # 限流命中风暴：近 5 分钟聚合拒绝速率 > 1/s（per-user 防刷正常为偶发，
      # 聚合超阈值意味着批量爬虫/攻击或某接口被大量用户打满）
      - alert: RateLimitStorm
        expr: |
          sum(rate(qinghe_ratelimit_rejected_total[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "限流命中速率异常"
          description: "近 5 分钟限流拒绝聚合 {{ $value | humanize }} 次/秒，超过 1/s 阈值；请结合 Grafana 按 key 标签定位被刷接口（tag 已按接口维度归一化）。"

      # 商品缓存命中率过低：< 30% 持续 15 分钟（缓存收益失效——
      # 失效风暴/Redis 抖动/写穿透放大，回源压力将传导至 MySQL）
      - alert: ProductCacheHitRatioLow
        expr: |
          qinghe_product_cache_hitratio < 0.3
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "商品缓存命中率过低"
          description: "商品缓存命中率 {{ $value | humanizePercentage }} 低于 30% 且持续 15 分钟（启动预热期误报已由 for 时长规避），排查 Redis 状态与写失效模式。"

      # 秒杀库存水位过低：任一进行中活动 Redis 闸门剩余 ≤ 5
      # （运营视角：临近售罄提醒，activityId 标签可定位具体活动）
      - alert: SeckillStockLow
        expr: |
          qinghe_seckill_stock_remain <= 5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "秒杀活动库存水位过低（活动 {{ $labels.activityId }}）"
          description: "秒杀活动 {{ $labels.activityId }} 的 Redis 闸门剩余库存仅 {{ $value }}，即将售罄；如需扩容请追加活动库存并重建闸门（toggle ONGOING 自动预热）。"

      # 延迟关单死信：10 分钟内出现任何死信（关单任务重试耗尽，
      # 意味着超时订单未被关闭、库存/券未回补，必须人工介入）
      - alert: OrderTimeoutDeadLetter
        expr: |
          increase(qinghe_order_timeout_deadletter_total[10m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "订单超时关单出现死信"
          description: "近 10 分钟出现 {{ $value | humanize }} 条延迟关单死信，超时订单未被关闭（库存/券未回补），请立即人工核查 order 表 WAIT_BUYER_PAY 超时单并手动关闭。"

# ------------------------------------------------------------
# 通知接入（P1-9 已启用 Alertmanager 链路；C2 已按 severity 分级路由）：
# 1) Prometheus → Alertmanager：prometheus.yml alerting 段已指向
#    alertmanager:9093；分级通知渠道（critical→ops-pager / warning→ops-im）
#    在 deploy/alertmanager.yml 中配置，替换占位 url 即可通知到人；
# 2) 或 Grafana 统一告警（Grafana 10+ 内置）：Loki ERROR 日志速率告警
#    已随 C2 落地于 deploy/grafana/provisioning/alerting/（Prometheus
#    无法查询 Loki，日志类告警由 Grafana 统一告警承载）。
# ------------------------------------------------------------
