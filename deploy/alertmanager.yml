# ============================================================
# Alertmanager 配置（P1-9 告警出口；C2 分级路由细化）
# 由 docker-compose 挂载到 /etc/alertmanager/alertmanager.yml
# 上游：Prometheus alerting → alertmanager:9093
#
# 分级路由（C2）：
#   severity=critical → ops-pager（快速通道：group_wait 10s + 重复提醒 30m）
#   severity=warning  → ops-im（普通通道：group_wait 30s + 重复提醒 4h）
#
# 通知渠道说明：
#   默认配置 webhook 接收器（占位地址）。接入真实渠道时二选一：
#   1) 钉钉/企微：部署 prometheus-webhook-dingtalk 等适配器，
#      将下方 url 替换为适配器地址（如 http://dingtalk:8060/dingtalk/ops/send）；
#   2) 邮件：取消 email receiver 注释并补齐 SMTP 信息。
#   未接入真实渠道前，告警仍可在 Alertmanager UI（127.0.0.1:9093）查看。
# ============================================================
global:
  resolve_timeout: 5m

route:
  # 同一告警名 + 严重级别聚合为一组，避免告警风暴
  group_by: ["alertname", "severity"]
  group_wait: 30s        # 首次等待聚合
  group_interval: 5m     # 同组新增告警间隔
  repeat_interval: 4h    # 未恢复告警重复提醒间隔（warning 默认）
  receiver: ops-im
  routes:
    # critical（BackendDown / OrderTimeoutDeadLetter）：
    # 快速通道——10s 内即发出（不等聚合）、重复提醒缩短至 30m
    - matchers:
        - severity = critical
      receiver: ops-pager
      group_wait: 10s
      repeat_interval: 30m
    # warning（5xx 率/P95/限流风暴/缓存命中率/秒杀水位等）：
    # 普通通道——默认聚合节奏，4h 重复提醒
    - matchers:
        - severity = warning
      receiver: ops-im
      repeat_interval: 4h

receivers:
  # critical 快速通道接收器（占位 webhook：替换为电话/短信/钉钉高频机器人）
  - name: ops-pager
    webhook_configs:
      - url: "http://alert-webhook:8060/dingtalk/pager/send"
        send_resolved: true

  # warning 普通通道接收器（占位 webhook：替换为钉钉/企微群机器人）
  - name: ops-im
    webhook_configs:
      - url: "http://alert-webhook:8060/dingtalk/ops/send"
        send_resolved: true

  # ---- 邮件渠道（可选，按需启用并补齐 SMTP 信息）----
  # - name: email
  #   email_configs:
  #     - to: "ops@example.com"
  #       from: "alertmanager@example.com"
  #       smarthost: "smtp.example.com:465"
  #       auth_username: "alertmanager@example.com"
  #       auth_password: "SMTP 授权码"
  #       require_tls: true

inhibit_rules:
  # 实例已宕机（BackendDown）时，抑制其派生的错误率/延迟/中间件类告警，减少噪音
  - source_matchers:
      - alertname = BackendDown
    target_matchers:
      - alertname =~ "HighHttpErrorRate|HighHttpLatency|RateLimitStorm|ProductCacheHitRatioLow|SeckillStockLow|OrderTimeoutDeadLetter"
    equal: ["application"]
