# ============================================================
# 青禾商城 CI 流水线（M3-10）
# 每次 push/PR 自动执行：后端编译+单测+打包 / 前端构建
# ============================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend compile + test + package
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root123
          MYSQL_DATABASE: qinghedb
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -proot123"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Init database
        run: |
          mysql -h 127.0.0.1 -uroot -proot123 --default-character-set=utf8mb4 < backend/index.sql

      - name: Run tests
        working-directory: backend
        env:
          # 测试连库口令必须与上方 mysql 服务一致（root123）；
          # 其余连接默认值（localhost:3306 / qinghedb / root / localhost:6379）与 dev profile 默认一致
          DB_PASSWORD: root123
        run: mvn -B test

      - name: Package
        working-directory: backend
        run: mvn -B package -DskipTests

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qinghe-mall-backend-jar
          path: backend/target/qinghe-mall-1.0.0.jar

  frontend:
    name: Frontend lint + test + build + audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # P1-15：Node 18 EOL → 20 LTS
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # P1-17：依赖漏洞扫描（高危及以上即失败）
      - name: Audit dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Unit tests (Vitest)
        working-directory: frontend
        run: npm run test

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qinghe-mall-frontend-dist
          path: frontend/dist

  # P1-17：后端依赖漏洞扫描（OWASP Dependency-Check，独立 job 避免拖慢主流程）
  backend-security:
    name: Backend dependency security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: OWASP dependency-check
        working-directory: backend
        run: mvn -B -Psecurity-check verify -DskipTests
        # 注意：NVD API 首次下载数据库较慢且受官方限流，如遇超时可缓存 ~/.m2 或使用 NVD API Key
