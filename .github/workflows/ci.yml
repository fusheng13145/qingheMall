# ============================================================
# 青禾商城 CI 流水线（M3-10）
# 每次 push/PR 自动执行：后端编译+单测+打包 / 前端构建
# ============================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend compile + test + package
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root123
          MYSQL_DATABASE: qinghedb
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -proot123"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Init database
        run: |
          mysql -h 127.0.0.1 -uroot -proot123 --default-character-set=utf8mb4 < backend/index.sql

      - name: Run tests
        working-directory: backend
        env:
          # 测试连库口令必须与上方 mysql 服务一致（root123）；
          # 其余连接默认值（localhost:3306 / qinghedb / root / localhost:6379）与 dev profile 默认一致
          DB_PASSWORD: root123
        run: mvn -B test

      - name: Package
        working-directory: backend
        run: mvn -B package -DskipTests

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qinghe-mall-backend-jar
          path: backend/target/qinghe-mall-1.0.0.jar

  frontend:
    name: Frontend lint + test + build + audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # P1-15：Node 18 EOL → 20 LTS
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # P1-17：依赖漏洞扫描（高危及以上即失败）
      - name: Audit dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Lint
        working-directory: frontend
        run: npm run lint

      # P2-16：带覆盖率门禁运行（阈值见 vite.config.js，低于阈值即失败）
      - name: Unit tests (Vitest + coverage gate)
        working-directory: frontend
        run: npm run test:coverage

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qinghe-mall-frontend-dist
          path: frontend/dist

  # ============================================================
  # C1（v1.4）：E2E 关键路径冒烟（Playwright）
  #   - 前台主链路：注册 → 登录 → 加购 → 下单 → 模拟支付 → 支付成功
  #   - 管理端冒烟：admin 登录 → 仪表盘
  #   - 依赖 mysql/redis 服务容器 + 后端 jar（dev profile）+ vite dev（5199 专用端口，
  #     已在 CSRF 默认白名单，避免与本机其他 5173 应用冲突）
  # ============================================================
  e2e:
    name: E2E smoke (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root123
          MYSQL_DATABASE: qinghedb
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -proot123"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Init database
        run: |
          mysql -h 127.0.0.1 -uroot -proot123 --default-character-set=utf8mb4 < backend/index.sql

      - name: Build backend jar
        working-directory: backend
        run: mvn -B package -DskipTests

      - name: Start backend (dev profile)
        working-directory: backend
        env:
          DB_PASSWORD: root123
        run: |
          java -jar target/qinghe-mall-1.0.0.jar --spring.profiles.active=dev > /tmp/qinghe-backend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:8080/api/product/page?pageNum=1&pageSize=1" > /dev/null; then
              echo "backend ready"
              exit 0
            fi
            sleep 2
          done
          echo "backend failed to start"; tail -100 /tmp/qinghe-backend.log; exit 1

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E smoke
        working-directory: frontend
        run: npx playwright test

      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qinghe-mall-e2e-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  # P1-17：后端依赖漏洞扫描（OWASP Dependency-Check，独立 job 避免拖慢主流程）
  backend-security:
    name: Backend dependency security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: OWASP dependency-check
        working-directory: backend
        run: mvn -B -Psecurity-check verify -DskipTests
        # 注意：NVD API 首次下载数据库较慢且受官方限流，如遇超时可缓存 ~/.m2 或使用 NVD API Key

  # ============================================================
  # P2-20：CD 流水线 —— CI 全绿后构建并推送 Docker 镜像至 GHCR
  #   - 仅 main 分支 push 触发（PR 只跑 CI，不发布镜像）
  #   - needs 保证后端单测/前端测试通过后才构建镜像
  #   - 使用内置 GITHUB_TOKEN 登录 GHCR，无需额外配置仓库密钥
  #   - 镜像标签：sha-<短哈希>（可追溯）+ main（滚动最新）
  # ============================================================
  cd:
    name: Build & push Docker images (CD)
    needs: [backend, frontend, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend image metadata
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/qinghe-mall-backend
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Frontend image metadata
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/qinghe-mall-frontend
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
