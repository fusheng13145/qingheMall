# ==================== 生产环境（prod） ====================
# 安全要求：数据库 / Redis 口令一律通过环境变量注入，不提供任何默认值。
# 部署时必须设置：DB_URL / DB_USERNAME / DB_PASSWORD / REDIS_HOST / REDIS_PORT / REDIS_PASSWORD
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==================== Redis（Boot 3 命名空间：spring.data.redis.*）====================
# ⚠️ P0-1 修复（2026-08-11）：原为 Boot 2 旧命名空间 spring.redis.*，而 RedissonConfig 与
# Spring Data Redis（Spring Session）在 Boot 3 下读取 spring.data.redis.*，导致 REDIS_HOST/
# PORT/PASSWORD 环境变量在 prod 被静默忽略、回退 localhost:6379，Docker 部署后端启动即失败。
# 现与 application-dev.properties 命名空间保持一致。
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.timeout=5000ms

# ==================== 生产安全强化 ====================
# 生产关闭 Druid 监控台，如需开启必须设置强口令
spring.datasource.druid.stat-view-servlet.enabled=${DRUID_MONITOR_ENABLED:false}

# 生产禁用模拟支付（必须配置真实支付渠道；如需临时放行显式设 PAY_MOCK_ENABLED=true）
app.pay.mock-enabled=${PAY_MOCK_ENABLED:false}

# Session Cookie 加固：仅经 HTTPS 传输（配合 HTTPS 部署），禁止 JS 读取
# ⚠️ Secure 标记改为环境变量注入（默认 true）：纯 HTTP 部署时浏览器不会发送 Secure Cookie，
# 会导致登录态完全失效；未启用 HTTPS 的过渡环境可临时设 COOKIE_SECURE=false。
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# ==================== Elasticsearch（阶段二 B-② 全文检索）====================
# 生产连 compose 内网 elasticsearch 容器；支持 ELASTICSEARCH_HOSTS 环境变量覆盖
elasticsearch.hosts=${ELASTICSEARCH_HOSTS:http://elasticsearch:9200}

# ==================== Loki（阶段二 C 日志聚合，#22 后端直推）====================
# 生产连 compose 内网 loki 容器；支持 LOKI_URL 环境变量覆盖
logging.loki.url=${LOKI_URL:http://loki:3100/loki/api/v1/push}

# ==================== Vault 密钥托管（#24 / #38，prod 启用）====================
# 部署前置：运维侧 Vault 服务端就绪，并通过环境变量注入以下三项（均不入库）：
#   VAULT_ADDR        Vault 服务端地址（含协议与端口）
#   VAULT_TOKEN       访问令牌（AppRole/短期令牌，禁止提交；生产建议 K8s/Vault Agent 注入）
#   VAULT_SECRET_PATH KV v2 完整路径（mount + 路径），如 secret/qinghe-mall
# secret/data/{path} 下以 Spring 属性键存放密钥：alipay.* / wechat.pay.* /
# spring.datasource.password / spring.data.redis.password /
# spring.datasource.druid.stat-view-servlet.login-password 等。
vault.enabled=${VAULT_ENABLED:true}
vault.uri=${VAULT_ADDR:https://vault.example.com:8200}
vault.token=${VAULT_TOKEN}
vault.secret-path=${VAULT_SECRET_PATH:secret/qinghe-mall}
# vault.namespace=（可选，Vault Enterprise / HCP 多租户时经 VAULT_NAMESPACE 注入）
