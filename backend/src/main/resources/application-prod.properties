# ==================== 生产环境（prod） ====================
# 安全要求：数据库 / Redis 口令一律通过环境变量注入，不提供任何默认值。
# 部署时必须设置：DB_URL / DB_USERNAME / DB_PASSWORD / REDIS_HOST / REDIS_PORT / REDIS_PASSWORD
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==================== Redis（Boot 3 命名空间：spring.data.redis.*）====================
# ⚠️ P0-1 修复（2026-08-11）：原为 Boot 2 旧命名空间 spring.redis.*，而 RedissonConfig 与
# Spring Data Redis（Spring Session）在 Boot 3 下读取 spring.data.redis.*，导致 REDIS_HOST/
# PORT/PASSWORD 环境变量在 prod 被静默忽略、回退 localhost:6379，Docker 部署后端启动即失败。
# 现与 application-dev.properties 命名空间保持一致。
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.timeout=5000ms

# ==================== 生产安全强化 ====================
# 生产关闭 Druid 监控台，如需开启必须设置强口令
spring.datasource.druid.stat-view-servlet.enabled=${DRUID_MONITOR_ENABLED:false}

# 生产禁用模拟支付（必须配置真实支付渠道；如需临时放行显式设 PAY_MOCK_ENABLED=true）
app.pay.mock-enabled=${PAY_MOCK_ENABLED:false}

# Session Cookie 加固：仅经 HTTPS 传输（配合 HTTPS 部署），禁止 JS 读取
# ⚠️ Secure 标记改为环境变量注入（默认 true）：纯 HTTP 部署时浏览器不会发送 Secure Cookie，
# 会导致登录态完全失效；未启用 HTTPS 的过渡环境可临时设 COOKIE_SECURE=false。
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# ==================== Elasticsearch（阶段二 B-② 全文检索）====================
# 生产连 compose 内网 elasticsearch 容器；支持 ELASTICSEARCH_HOSTS 环境变量覆盖
elasticsearch.hosts=${ELASTICSEARCH_HOSTS:http://elasticsearch:9200}
