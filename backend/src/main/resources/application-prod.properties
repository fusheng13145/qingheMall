# ==================== 生产环境（prod） ====================
# 安全要求：数据库 / Redis 口令一律通过环境变量注入，不提供任何默认值。
# 部署时必须设置：DB_URL / DB_USERNAME / DB_PASSWORD / REDIS_HOST / REDIS_PORT / REDIS_PASSWORD
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==================== Redis（Redisson 自动装配读取 spring.redis.*） ====================
spring.redis.host=${REDIS_HOST}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD}
spring.redis.timeout=5000ms

# ==================== 生产安全强化 ====================
# 生产关闭 Druid 监控台，如需开启必须设置强口令
spring.datasource.druid.stat-view-servlet.enabled=${DRUID_MONITOR_ENABLED:false}

# 生产禁用模拟支付（必须配置真实支付渠道；如需临时放行显式设 PAY_MOCK_ENABLED=true）
app.pay.mock-enabled=${PAY_MOCK_ENABLED:false}

# Session Cookie 加固：仅经 HTTPS 传输（配合下方 HTTPS/HSTS 部署），禁止 JS 读取
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
