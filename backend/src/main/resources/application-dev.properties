# ==================== 开发环境（dev） ====================
# 本地开发数据库：口令可用环境变量 DB_PASSWORD 覆盖，默认 1234 仅限本地
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/qinghedb?serverTimezone=GMT%2B8&useUnicode=true&characterEncoding=utf-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==================== Redis（Boot 3：Redisson 自动装配读取 spring.data.redis.*） ====================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=${REDIS_TIMEOUT:5000ms}

# ==================== Elasticsearch（阶段二 B-② 全文检索）====================
# 开发环境连本机已启动的 ES（docker compose up elasticsearch，仅绑 127.0.0.1:9200）
elasticsearch.hosts=${ELASTICSEARCH_HOSTS:http://localhost:9200}

# ==================== Loki（阶段二 C 日志聚合，#22 后端直推）====================
# 开发环境连本机已启动的 Loki（docker compose up loki，仅绑 127.0.0.1:3100）
logging.loki.url=${LOKI_URL:http://localhost:3100/loki/api/v1/push}

# ==================== Vault 密钥托管（#24 / #38，dev 显式关闭）====================
# 开发环境密钥经环境变量兜底（见 application.properties 的 ${ENV:default}），不连 Vault。
vault.enabled=false
