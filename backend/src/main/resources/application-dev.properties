# ==================== 开发环境（dev） ====================
# 本地开发数据库：口令可用环境变量 DB_PASSWORD 覆盖，默认 1234 仅限本地
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/qinghedb?serverTimezone=GMT%2B8&useUnicode=true&characterEncoding=utf-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==================== Redis（Redisson 自动装配读取 spring.redis.*） ====================
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.timeout=${REDIS_TIMEOUT:5000ms}
