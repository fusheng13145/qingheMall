# ==================== 青禾商城 通用配置 ====================
spring.application.name=qinghe-mall
server.port=8080

# 默认使用 dev profile；生产环境通过 SPRING_PROFILES_ACTIVE=prod 覆盖
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

mybatis.mapper-locations=classpath:com/qinghe/mall/dao/*.xml

# ==================== Redisson ====================
# 自动配置对空密码仍发 AUTH（本地无密码 Redis 会连不上），
# 由 RedissonConfig 显式构建 RedissonClient，这里排除自动配置
# （Boot 3 + Redisson 3.27：自动配置类已更名为 RedissonAutoConfigurationV2）
spring.autoconfigure.exclude=org.redisson.spring.starter.RedissonAutoConfigurationV2

# ==================== JSON ====================
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.default-property-inclusion=non_null

# ==================== 会话安全 ====================
# 会话有效期 30 分钟（不活跃超时）
server.servlet.session.timeout=30m
# Cookie 仅限 HTTP 访问，禁止 JS 读取，降低 XSS 窃取会话的风险
server.servlet.session.cookie.http-only=true
# SameSite=Lax：阻止跨站请求携带会话 Cookie（基础 CSRF 防线）
server.servlet.session.cookie.same-site=Lax

# ==================== Druid 监控台 ====================
# P0-7 修复：默认关闭（原默认开启 + druid/druid 弱口令可暴露数据源信息）；
# 如需开启必须显式 DRUID_MONITOR_ENABLED=true 并设置强口令（DruidMonitorGuard 启动校验）
spring.datasource.druid.stat-view-servlet.enabled=${DRUID_MONITOR_ENABLED:false}
spring.datasource.druid.stat-view-servlet.url-pattern=/druid/*
spring.datasource.druid.stat-view-servlet.login-username=${DRUID_LOGIN_USERNAME:admin}
spring.datasource.druid.stat-view-servlet.login-password=${DRUID_LOGIN_PASSWORD:QingHe_Druid!2026}

# ==================== CSRF Referer 白名单 ====================
# 允许携带会话 Cookie 的跨域来源（多个用逗号分隔），本机开发默认放行
app.security.csrf.enabled=${CSRF_ENABLED:true}
app.security.csrf.allowed-origins=${CSRF_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080}
# 无需校验来源的路径前缀（微信/支付宝支付回调等服务器间调用）
app.security.csrf.exclude-paths=${CSRF_EXCLUDE_PATHS:/api/pay/wechatNotify,/api/pay/alipayNotify}

# MD5 存量密码兼容开关（架构级遗留项）：过渡期默认 true；确认存量库无 MD5 用户后置 false 拒绝 MD5 登录
app.security.allow-md5-login=${ALLOW_MD5_LOGIN:true}

# ==================== 支付宝（M2-9 真实支付，优先级高于微信） ====================
# 全部通过环境变量注入；未配置时自动回退模拟支付。申请指引见《青禾商城手册.md》§6 支付接入。
alipay.app-id=${ALIPAY_APP_ID:}
# 应用私钥：PEM 内容（-----BEGIN 开头）或文件路径，PKCS1/PKCS8 均可
alipay.private-key=${ALIPAY_PRIVATE_KEY:}
# 支付宝公钥：PEM 内容或文件路径（回调验签）
alipay.alipay-public-key=${ALIPAY_PUBLIC_KEY:}
# 回调地址（公网 HTTPS；本地联调可用内网穿透）
alipay.notify-url=${ALIPAY_NOTIFY_URL:https://your-domain.com/api/pay/alipayNotify}
# 网关：沙箱 openapi.alipaydev.com / 正式 openapi.alipay.com
alipay.gateway=${ALIPAY_GATEWAY:https://openapi.alipaydev.com/gateway.do}

# ==================== 微信支付 v3（M2-9 真实支付） ====================
# 全部通过环境变量注入；未配置时自动回退模拟支付。申请指引见《青禾商城手册.md》§6 支付接入。
wechat.pay.appid=${WECHAT_PAY_APPID:}
wechat.pay.mchid=${WECHAT_PAY_MCHID:}
wechat.pay.api-v3-key=${WECHAT_PAY_API_V3_KEY:}
wechat.pay.private-key-path=${WECHAT_PAY_PRIVATE_KEY_PATH:}
wechat.pay.serial-no=${WECHAT_PAY_SERIAL_NO:}
wechat.pay.notify-url=${WECHAT_PAY_NOTIFY_URL:https://your-domain.com/api/pay/wechatNotify}
wechat.pay.platform-cert-path=${WECHAT_PAY_PLATFORM_CERT_PATH:}
wechat.pay.api-base=${WECHAT_PAY_API_BASE:https://api.mch.weixin.qq.com}

# ==================== 文件上传（M3-4 图片本地化） ====================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
# 本地上传目录（可通过 UPLOAD_DIR 环境变量覆盖），经 /uploads/** 静态映射对外访问
app.upload.dir=${UPLOAD_DIR:./upload}

# ==================== 模拟支付开关（P1 修复） ====================
# 生产环境必须置 false（PAY_MOCK_ENABLED=false），防止绕过真实支付；dev 默认开启便于演示
app.pay.mock-enabled=${PAY_MOCK_ENABLED:true}

# ==================== 监控与链路追踪（P2-2） ====================
# 暴露 Prometheus 指标端点（Spring Boot 自动提供 http.server.requests / jvm.* 等指标）
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=never
management.metrics.tags.application=qinghe-mall
# 日志输出 traceId（TraceIdFilter 写入 MDC，跨请求/线程可关联排查）
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%X{traceId:-}] [%thread] %logger{36} - %msg%n

# ==================== Vault 密钥托管（#24 / #38）====================
# 默认关闭；仅 prod（SPRING_PROFILES_ACTIVE=prod）通过 VAULT_ENABLED=true 启用。
# 启用后 VaultEnvironmentPostProcessor 于环境准备阶段从 Vault KV v2 拉取密钥，
# 注入为最高优先级属性源，现有 @Value(${alipay.*} / ${wechat.pay.*} / ${spring.datasource.password} 等) 零改动取数。
# dev/test 关闭：本处理器为空操作，密钥仍走既有环境变量 ${ENV:default} 兜底。
vault.enabled=${VAULT_ENABLED:false}
