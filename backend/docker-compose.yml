services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: qinghe-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: qinghe_user
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - qinghe-network

  # Redis 缓存
  redis:
    image: redis:6.2-alpine
    container_name: qinghe-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - qinghe-network

  # RabbitMQ 消息队列
  rabbitmq:
    image: rabbitmq:3.11-management-alpine
    container_name: qinghe-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - qinghe-network

  # Nacos 注册中心 + 配置中心
  nacos:
    image: nacos/nacos-server:v2.1.2
    container_name: qinghe-nacos
    ports:
      - "8848:8848"
      - "9848:9848"
    environment:
      MODE: standalone
      JVM_XMS: 256m
      JVM_XMX: 512m
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs
    depends_on:
      - mysql
    networks:
      - qinghe-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Seata 分布式事务
  seata:
    image: seataio/seata-server:1.6.1
    container_name: qinghe-seata
    ports:
      - "8091:8091"
      - "7091:7091"
    environment:
      SEATA_CONFIG_NAME: file:/root/seata-config/registry
      SEATA_STORE_MODE: db
      DBHOST: mysql
      DBPORT: 3306
      DBUSER: root
      DBPWD: 123456
      DBDATABASE: qinghe_user
    volumes:
      - ./seata-config/registry.lua:/root/seata-config/registry.lua
    depends_on:
      - mysql
    networks:
      - qinghe-network

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  nacos-data:
  nacos-logs:

networks:
  qinghe-network:
    driver: bridge
